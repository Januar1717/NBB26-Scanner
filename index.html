
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner NASDEM BUGAR BERBAGI</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111111;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 22px 15px;
  background: #000000;
  border-bottom: 2px solid #D4AF37;
}

header h1 {
  color: #D4AF37;
  font-size: 22px;
  margin: 0;
}

header p {
  font-size: 13px;
  color: #cccccc;
  margin-top: 8px;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1e1e1e;
  border: 1px solid #333333;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 18px;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: none;
  border-radius: 9px;
  background: #D4AF37;
  color: #111111;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #555555;
  color: #bbbbbb;
}

#hasil {
  display: none;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  margin-top: 20px;
}

#hasil h2 {
  margin-top: 0;
  font-size: 22px;
}

#hasil p {
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.valid {
  background: #123b22;
  border: 2px solid #28a745;
  color: #9cffad;
}

.invalid {
  background: #481818;
  border: 2px solid #dc3545;
  color: #ffaaaa;
}

.warning {
  background: #473817;
  border: 2px solid #ffc107;
  color: #ffe08a;
}

.info {
  text-align: center;
  color: #aaaaaa;
  font-size: 12px;
  line-height: 1.7;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
  <h1>NASDEM BUGAR BERBAGI</h1>
  <p>SCANNER TIKET PESERTA UMUM</p>
</header>

<div class="container">

  <div class="card">
    <div id="reader"></div>

    <button id="btnMulai" onclick="mulaiScanner()">
      📷 MULAI SCAN QR
    </button>

    <button id="btnStop" onclick="berhentiScanner()" disabled>
      ⏹ BERHENTI SCAN
    </button>
  </div>

  <div id="hasil"></div>

  <div class="info">
    DPW PARTAI NASDEM DKI JAKARTA<br>
    NASDEM BUGAR BERBAGI – 8 NOVEMBER 2026
  </div>

</div>

<script>

// GANTI URL INI DENGAN URL WEB APP APPS SCRIPT
const API_URL = "GANTI_DENGAN_URL_WEB_APP_APPS_SCRIPT";

let scanner = null;
let sedangMemproses = false;


// MULAI SCANNER
async function mulaiScanner() {

  if (scanner) return;

  document.getElementById("btnMulai").disabled = true;
  document.getElementById("btnStop").disabled = false;

  scanner = new Html5Qrcode("reader");

  try {

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1
      },
      qrBerhasil,
      () => {}
    );

  } catch (error) {

    tampilHasil(
      "warning",
      "KAMERA TIDAK DAPAT DIAKTIFKAN",
      "Pastikan browser memiliki izin kamera dan website menggunakan HTTPS."
    );

    scanner = null;

    document.getElementById("btnMulai").disabled = false;
    document.getElementById("btnStop").disabled = true;
  }
}


// SAAT QR BERHASIL DIBACA
async function qrBerhasil(teksQR) {

  if (sedangMemproses) return;

  sedangMemproses = true;

  await berhentiScanner();

  const kode = teksQR.trim();

  tampilHasil(
    "warning",
    "MEMERIKSA TIKET...",
    "Kode: " + kode
  );

  // JSONP untuk menghindari masalah CORS GitHub Pages
  const callbackName = "cbNBB_" + Date.now();

  window[callbackName] = function(data) {

    delete window[callbackName];

    if (data.success && data.status === "VALID") {

      tampilHasil(
        "valid",
        "✅ TIKET BERHASIL DITUKARKAN!",
        "Nama: " + data.nama +
        "<br>Kode Tiket: " + data.kode +
        "<br>Waktu: " + data.waktu
      );

    } else if (data.status === "REDEEMED") {

      tampilHasil(
        "invalid",
        "⛔ TIKET SUDAH DIGUNAKAN!",
        "Nama: " + data.nama +
        "<br>Kode Tiket: " + data.kode +
        "<br>Waktu penukaran sebelumnya: " + data.waktu
      );

    } else if (data.status === "INVALID") {

      tampilHasil(
        "invalid",
        "❌ TIKET TIDAK TERDAFTAR",
        "Kode: " + kode
      );

    } else {

      tampilHasil(
        "warning",
        "⚠️ " + data.message,
        "Kode: " + kode
      );
    }

    sedangMemproses = false;
  };

  const script = document.createElement("script");

  script.src =
    API_URL +
    "?kode=" + encodeURIComponent(kode) +
    "&callback=" + callbackName;

  script.onerror = function() {

    delete window[callbackName];

    tampilHasil(
      "warning",
      "KONEKSI GAGAL",
      "Periksa internet dan URL Apps Script."
    );

    sedangMemproses = false;
  };

  document.body.appendChild(script);
}


// STOP SCANNER
async function berhentiScanner() {

  if (scanner) {

    try {
      await scanner.stop();
      scanner.clear();
    } catch (error) {
      console.log(error);
    }

    scanner = null;
  }

  document.getElementById("btnMulai").disabled = false;
  document.getElementById("btnStop").disabled = true;
}


// TAMPILKAN HASIL VALIDASI
function tampilHasil(tipe, judul, isi) {

  const hasil = document.getElementById("hasil");

  hasil.className = tipe;
  hasil.style.display = "block";

  hasil.innerHTML =
    "<h2>" + judul + "</h2>" +
    "<p>" + isi + "</p>";
}

</script>

</body>
</html>
